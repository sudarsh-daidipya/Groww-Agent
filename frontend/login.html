<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In / Sign Up • Algo Trader Terminal</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: radial-gradient(circle at top, #1e293b, #0b0f19 70%); margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    .login-card { width: 100%; max-width: 410px; background: #111827; border: 1px solid #1f2937; border-radius: 14px; padding: 28px; box-shadow: 0 20px 45px rgba(0, 0, 0, 0.65); }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 20px; color: #f8fafc; margin: 0 0 6px; letter-spacing: 0.5px; }
    .header p { font-size: 12.5px; color: #94a3b8; margin: 0; }
    .auth-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: #0b0f19; padding: 4px; border-radius: 8px; margin-bottom: 18px; }
    .auth-tab { background: transparent; border: none; color: #94a3b8; padding: 8px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .auth-tab.active { background: #1e293b; color: #f8fafc; }
    .google-wrap { display: flex; justify-content: center; margin-bottom: 16px; min-height: 42px; }
    .divider { display: flex; align-items: center; gap: 10px; color: #64748b; font-size: 11.5px; margin-bottom: 16px; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #1f2937; }
    .auth-form { display: flex; flex-direction: column; gap: 12px; }
    .auth-form label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: #cbd5e1; }
    .auth-form input { padding: 10px 12px; font-size: 13.5px; background: #0b0f19; border: 1px solid #374151; border-radius: 6px; color: #fff; }
    .submit-btn { padding: 11px; font-size: 14px; font-weight: 600; background: #2563eb; color: #fff; border: none; border-radius: 7px; cursor: pointer; margin-top: 4px; }
    .error-msg { background: #7f1d1d; color: #fca5a5; padding: 9px 12px; margin-top: 14px; border-radius: 7px; font-size: 12.5px; text-align: center; display: none; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="header">
      <h1>⚡ ALGO TRADER TERMINAL</h1>
      <p id="sub-title">Sign in to access NIFTY & MCX Bot Controls</p>
    </div>
    <div class="auth-tabs">
      <button type="button" class="auth-tab active" id="tab-signin" onclick="setMode('signin')">Sign In</button>
      <button type="button" class="auth-tab" id="tab-signup" onclick="setMode('signup')">Sign Up</button>
    </div>
    <div class="google-wrap">
      <div id="g_id_onload" data-client_id="458048900570-n8u3gvfgo4pdcdomam4pt0sau6akpmoe.apps.googleusercontent.com" data-context="signin" data-ux_mode="popup" data-callback="handleGoogleCredential" data-auto_prompt="false"></div>
      <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="filled_black" data-text="continue_with" data-size="large" data-logo_alignment="left" data-width="340"></div>
    </div>
    <div class="divider">OR CONTINUE WITH EMAIL</div>
    <form class="auth-form" onsubmit="handleEmailAuth(event)">
      <label id="name-field" style="display: none;">Full Name <input type="text" id="auth-name" placeholder="Sudarsh Daidipya" /></label>
      <label>Email Address <input type="email" id="auth-email" placeholder="sudarsh9975@gmail.com" required /></label>
      <label>Password <input type="password" id="auth-pass" placeholder="Min 6 characters" required /></label>
      <button type="submit" id="submit-btn" class="submit-btn">Sign In</button>
    </form>
    <div id="err-box" class="error-msg"></div>
  </div>
  <script>
    if (localStorage.getItem("algo_token")) { window.location.replace("/"); }
    let mode = "signin";
    function setMode(m) {
      mode = m;
      document.getElementById("err-box").style.display = "none";
      document.getElementById("tab-signin").classList.toggle("active", mode === "signin");
      document.getElementById("tab-signup").classList.toggle("active", mode === "signup");
      document.getElementById("name-field").style.display = mode === "signup" ? "flex" : "none";
      document.getElementById("submit-btn").textContent = mode === "signup" ? "Create Account & Sign In" : "Sign In";
    }
    async function handleGoogleCredential(response) {
      const errBox = document.getElementById("err-box");
      errBox.style.display = "none";
      try {
        const res = await fetch("/api/auth/google", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ credential: response.credential })
        });
        const data = await res.json();
        if (res.ok && data.token) {
          localStorage.setItem("algo_token", data.token);
          window.location.replace("/");
        } else {
          errBox.textContent = data.detail || "Google authentication failed!";
          errBox.style.display = "block";
        }
      } catch (e) {
        errBox.textContent = "Server error: " + e.message;
        errBox.style.display = "block";
      }
    }
    async function handleEmailAuth(e) {
      e.preventDefault();
      const errBox = document.getElementById("err-box");
      errBox.style.display = "none";
      const endpoint = mode === "signup" ? "/api/auth/signup" : "/api/auth/login";
      const payload = {
        name: document.getElementById("auth-name").value.trim(),
        email: document.getElementById("auth-email").value.trim(),
        password: document.getElementById("auth-pass").value
      };
      try {
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok && data.token) {
          localStorage.setItem("algo_token", data.token);
          window.location.replace("/");
        } else {
          errBox.textContent = data.detail || "Authentication failed!";
          errBox.style.display = "block";
        }
      } catch (e) {
        errBox.textContent = "Server error: " + e.message;
        errBox.style.display = "block";
      }
    }
  </script>
</body>
</html>
