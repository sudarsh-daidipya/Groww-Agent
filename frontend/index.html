<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In • Algo Trader Terminal</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="stylesheet" href="/src/style.css" />
  <style>
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: radial-gradient(circle at top, #1e293b, #0b0f19 70%);
      margin: 0; font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .login-card {
      width: 100%; max-width: 400px; background: #111827;
      border: 1px solid #1f2937; border-radius: 14px; padding: 32px 28px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.65); text-align: center;
    }
    .login-card h1 { font-size: 20px; color: #f8fafc; margin: 0 0 8px; letter-spacing: 0.5px; }
    .login-card p { font-size: 13px; color: #94a3b8; margin: 0 0 24px; }
    .google-wrap { display: flex; justify-content: center; min-height: 44px; }
    .error-msg {
      background: #7f1d1d; color: #fca5a5; padding: 10px 12px; margin-top: 16px;
      border-radius: 8px; font-size: 12.5px; display: none;
    }
    .hint { font-size: 11.5px; color: #64748b; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>⚡ ALGO TRADER TERMINAL</h1>
    <p>Sign in with your authorized Google account to access NIFTY & MCX controls</p>

    <div class="google-wrap">
      <div id="g_id_onload"
           data-client_id="458048900570-n8u3gvfgo4pdcdomam4pt0sau6akpmoe.apps.googleusercontent.com"
           data-context="signin"
           data-ux_mode="popup"
           data-callback="handleGoogleCredential"
           data-auto_prompt="false">
      </div>
      <div class="g_id_signin"
           data-type="standard"
           data-shape="rectangular"
           data-theme="filled_black"
           data-text="signin_with"
           data-size="large"
           data-logo_alignment="left"
           data-width="300">
      </div>
    </div>

    <div id="err-box" class="error-msg"></div>
    <div class="hint">Protected by Google OAuth 2.0 • Local Session</div>
  </div>

  <script>
    async function handleGoogleCredential(response) {
      const errBox = document.getElementById("err-box");
      errBox.style.display = "none";

      try {
        const res = await fetch("/api/auth/google", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ credential: response.credential })
        });
        const data = await res.json();
        if (res.ok) {
          window.location.href = "/";
        } else {
          errBox.textContent = data.detail || "Authentication failed!";
          errBox.style.display = "block";
        }
      } catch (err) {
        errBox.textContent = "Server error while verifying Google login.";
        errBox.style.display = "block";
      }
    }
  </script>
</body>
</html>
